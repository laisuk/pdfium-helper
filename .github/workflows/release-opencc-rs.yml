name: release-opencc-rs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            bin_name: opencc-rs.exe
            asset_name: opencc-rs-win-x64.zip
            pdfium_subdir: win-x64
            pdfium_lib: pdfium.dll

          - name: linux-x64
            os: ubuntu-latest
            bin_name: opencc-rs
            asset_name: opencc-rs-linux-x64.zip
            pdfium_subdir: linux-x64
            pdfium_lib: libpdfium.so

          - name: macos-arm64
            os: macos-latest
            bin_name: opencc-rs
            asset_name: opencc-rs-macos-arm64.zip
            pdfium_subdir: macos-arm64
            pdfium_lib: libpdfium.dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install zip (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build (release)
        run: cargo build --release -p opencc-rs

      - name: Prepare package dir
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR="dist/opencc-rs-${{ matrix.name }}"
          mkdir -p "$PKG_DIR"

          cp "target/release/${{ matrix.bin_name }}" "$PKG_DIR/"
          cp "tools/opencc-rs/README.md" "$PKG_DIR/README.md"
          cp "pdfium/${{ matrix.pdfium_subdir }}/${{ matrix.pdfium_lib }}" "$PKG_DIR/${{ matrix.pdfium_lib }}"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "dist/opencc-rs-${{ matrix.name }}"
          $zip = "dist/${{ matrix.asset_name }}"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$pkg\*" -DestinationPath $zip

      - name: Create zip (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -r "${{ matrix.asset_name }}" "opencc-rs-${{ matrix.name }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}