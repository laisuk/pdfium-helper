[package]
name = "opencc-office-converter"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
publish = false
readme = "README.md"

[dependencies]
regex = "1.13"
# Support crates for the private ZIP module (Stored + Rust 1.75-compatible DEFLATE).
crc32fast = "1.5"
flate2 = { version = "=1.1.1", default-features = false, features = ["rust_backend"] }
indexmap = "=2.7.1"
memchr = "2.7"
